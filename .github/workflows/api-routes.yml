name: API Routes Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routes-mounted:
    name: Routes mounted (no-404 contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # PRP-220.05: pino-pretty hangs on Node 20+ in some envs; force JSON.
      LOG_PRETTY_PRINT: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build API bundle
        run: npm run api:build:ts

      - name: Run routes-mounted contract
        run: npm run test:api -- --testPathPattern='routes-mounted|app.cold-start|src/__tests__/cors'

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-api-log
          path: apps/api/.jest-api.log
          if-no-files-found: ignore

  # Production install, then the shared and API steps of vercel.json's
  # buildCommand. NODE_ENV=production skips devDependencies (e.g.
  # @types/jest), so test-only code compiled into the API fails here
  # instead of in a deploy.
  api-build:
    name: API production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install production dependencies
        run: npm install --legacy-peer-deps --force --no-audit --no-fund

      - name: Build shared package and API
        run: npm run shared:build && npm run api:build:ts
