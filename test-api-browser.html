<!DOCTYPE html>
<html>
<head>
    <title>Test API Browser</title>
</head>
<body>
    <h1>Test API Instagram</h1>
    <button onclick="testDirectAPI()">Test Direct API (port 3003)</button>
    <button onclick="testProxyAPI()">Test Proxy API (port 3000)</button>
    <button onclick="testHealth()">Test Health Check</button>
    <pre id="result"></pre>

    <script>
    const resultDiv = document.getElementById('result');
    
    async function log(message) {
        console.log(message);
        resultDiv.textContent += message + '\n';
    }
    
    async function testHealth() {
        resultDiv.textContent = '';
        try {
            log('Testing health check...');
            
            // Test direct
            const direct = await fetch('http://localhost:3003/api/health');
            log(`Direct (3003): ${direct.status} ${direct.statusText}`);
            
            // Test proxy
            const proxy = await fetch('http://localhost:3000/api/health');
            log(`Proxy (3000): ${proxy.status} ${proxy.statusText}`);
            
        } catch (error) {
            log('Error: ' + error.message);
        }
    }
    
    async function testDirectAPI() {
        resultDiv.textContent = '';
        try {
            log('Testing direct API on port 3003...');
            
            const response = await fetch('http://localhost:3003/api/parse-video-recipe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    videoUrl: 'https://www.instagram.com/reel/DJ63290I7L8/',
                    platform: 'instagram'
                })
            });
            
            log(`Status: ${response.status}`);
            const data = await response.json();
            log('Response: ' + JSON.stringify(data, null, 2));
            
        } catch (error) {
            log('Error: ' + error.message);
            log('Stack: ' + error.stack);
        }
    }
    
    async function testProxyAPI() {
        resultDiv.textContent = '';
        try {
            log('Testing proxy API on port 3000...');
            
            const response = await fetch('http://localhost:3000/api/parse-video-recipe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    videoUrl: 'https://www.instagram.com/reel/DJ63290I7L8/',
                    platform: 'instagram'
                })
            });
            
            log(`Status: ${response.status}`);
            const data = await response.json();
            log('Response: ' + JSON.stringify(data, null, 2));
            
        } catch (error) {
            log('Error: ' + error.message);
            log('Stack: ' + error.stack);
        }
    }
    </script>
</body>
</html>
